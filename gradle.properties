org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
# One JVM per build: the Kotlin compiler runs inside the Gradle daemon (agents building in parallel exhausted the PC's commit memory, 2026-10-31).
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official

# The site that serves the bank return page (/ritorno-banca.html) and /.well-known/assetlinks.json: the App Link host and the redirect address come from this one value.
pilastri.siteHost=pilastri.grtlabs.xyz
